<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personality Traits Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F8FF; --card:#FFFFFF; --ink:#1B2A4A; --soft:#5A6B8C;
  --sky:#2E9BD6; --sun:#FFD24A; --mint:#2FB67E; --berry:#E0456A;
  --line:#D6E2F3; --opt:#EEF4FC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1830; --card:#18233F; --ink:#EAF1FF; --soft:#A7B6D6;
    --sky:#5BB8EA; --sun:#FFD24A; --mint:#45D193; --berry:#FF6F8E;
    --line:#2A3A60; --opt:#21305A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1830; --card:#18233F; --ink:#EAF1FF; --soft:#A7B6D6;
  --sky:#5BB8EA; --sun:#FFD24A; --mint:#45D193; --berry:#FF6F8E;
  --line:#2A3A60; --opt:#21305A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.5;
  display:flex;justify-content:center;
}
.wrap{width:100%;max-width:560px;padding:20px 18px 32px;display:flex;flex-direction:column}
h1,h2,.big{font-family:"Fredoka","Nunito",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* start */
.start{text-align:center;margin:auto 0;padding:24px 0}
.faces{font-size:56px;letter-spacing:6px;line-height:1.1}
.start h1{font-size:clamp(34px,9vw,48px);line-height:1.05;margin:18px 0 10px;font-weight:700}
.start p{color:var(--soft);margin:0 auto 28px;max-width:30ch}
.go{
  background:var(--sky);color:#fff;border:0;border-radius:999px;
  padding:16px 40px;font-family:"Fredoka",sans-serif;font-size:21px;font-weight:600;
  box-shadow:0 5px 0 #1F74A3;transition:transform .08s, box-shadow .08s;
}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #1F74A3}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:var(--sun);border-radius:999px;transition:width .35s ease}
.stat{font-weight:800;font-size:15px;white-space:nowrap}

/* question */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px 20px}
.pic{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;margin-bottom:14px;background:#fff}
.count{text-align:center;color:var(--soft);font-weight:700;font-size:14px;margin-bottom:6px}
.q{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(21px,5.6vw,25px);line-height:1.25;text-align:center;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{
  text-align:left;background:var(--opt);border:2px solid var(--line);border-radius:14px;
  padding:13px 16px;font-weight:700;font-size:17px;display:flex;gap:12px;align-items:center;
}
.opt .k{
  flex:none;width:30px;height:30px;border-radius:9px;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--soft)
}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint);border-color:var(--mint);color:#fff}
.opt.right .k{background:#fff;color:var(--mint);border-color:#fff}
.opt.wrong{background:var(--berry);border-color:var(--berry);color:#fff;animation:shake .3s}
.opt.wrong .k{background:#fff;color:var(--berry);border-color:#fff}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:700;display:none}
.feedback.show{display:block}
.feedback.ok{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--ink)}
.feedback.no{background:color-mix(in srgb,var(--berry) 14%,transparent);color:var(--ink)}
.feedback b{display:block;font-family:"Fredoka",sans-serif;font-size:19px;margin-bottom:2px}
.next{margin-top:16px;width:100%;display:none}
.next.show{display:block}

/* end */
.end{text-align:center;margin:auto 0;padding:20px 0}
.end .big{font-size:clamp(64px,20vw,96px);font-weight:700;line-height:1;margin:10px 0 4px;color:var(--sky)}
.end .of{color:var(--soft);font-weight:800;margin-bottom:18px}
.end h2{font-size:28px;margin:0 0 8px}
.end p{color:var(--soft);margin:0 auto 26px;max-width:32ch}
.hidden{display:none !important}

/* perfect score */
.medal-wrap{position:relative;width:150px;height:150px;margin:0 auto 10px;display:grid;place-items:center}
.rays{position:absolute;inset:-50px;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--sun) 55%,transparent) 0 10deg,transparent 10deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);
  animation:spin 14s linear infinite, fadein .8s .3s both}
.medal{position:relative;width:130px;height:130px;animation:medal 1s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 6px 0 #D9A91C)}
.end.perfect .big{animation:pop .7s .6s cubic-bezier(.2,1.6,.4,1) both}
.end.perfect h2{animation:pop .6s .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes medal{0%{transform:scale(0) rotate(-220deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion: reduce){
  .fill,.go,.opt,.rays,.medal,.end.perfect .big,.end.perfect h2{transition:none;animation:none !important}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="wrap">

  <section id="start" class="start">
    <h1>Personality Traits Quiz</h1>
    <p>5 quick questions about our presentation. Can you get them all right?</p>
    <button class="go" id="startBtn">Start quiz</button>
  </section>

  <section id="game" class="hidden">
    <div class="top">
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="stat" id="score">Score 0</div>
      <div class="stat" id="streak">Streak 0</div>
    </div>
    <div class="card">
      <img class="pic hidden" id="pic" alt="">
      <div class="count" id="count"></div>
      <h2 class="q" id="question" aria-live="polite"></h2>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback" role="status"></div>
      <button class="go next" id="nextBtn">Next question</button>
    </div>
  </section>

  <section id="end" class="end hidden">
    <div class="medal-wrap hidden" id="medalWrap" aria-hidden="true">
      <div class="rays"></div>
      <svg class="medal" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#FFD24A"/><circle cx="60" cy="60" r="45" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="6 6"/><polygon points="60,24 70,48 96,49 75,65 83,91 60,76 37,91 45,65 24,49 50,48" fill="#fff"/></svg>
    </div>
    <div class="big" id="final"></div>
    <div class="of">out of 5</div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button class="go" id="againBtn">Play again</button>
  </section>

</main>

const QUESTIONS = [
  {img:IMG.q1, alt:"Two scientists looking at a world map with children from many countries", q:"What did researchers observe about people from different countries?",
   a:"They can have different personality traits",
   w:["They all have the same personality","They don’t have personalities","They only like sports"],
   x:"Researchers saw that people from different countries can be more outgoing, friendly or reserved."},
  {img:IMG.q2, alt:"Four teenagers with different personalities", q:"What is the main idea of the reading?",
   a:"Personality can change depending on people and their cultures",
   w:["Everyone in the world is shy","Culture is not important","Only children have personality traits"],
   x:"The main point: personality is different depending on the person and their culture."},
  {img:IMG.q3, alt:"A shy girl hiding behind her notebook while classmates say hello", q:"Ana gets nervous when she talks to new people. She is…",
   a:"Shy", w:["Confident","Outgoing","Creative"],
   x:"A shy person feels nervous with new people."},
  {img:IMG.q4, alt:"A girl doing her homework at a tidy desk with a completed checklist", q:"Sofía does her homework on time and keeps her promises. She is…",
   a:"Responsible", w:["Shy","Creative","Rude"],
   x:"A responsible person does what they need to do."},
  {q:"According to our presentation, people from Ecuador are…",
   a:"Friendly, hardworking, respectful and welcoming",
   w:["Lazy and unfriendly","Cold and quiet","Angry and impatient"],
   x:"We said Ecuadorians are friendly, hardworking, respectful and welcoming."}
];

const $ = id => document.getElementById(id);
let order=[], i=0, score=0, streak=0;

function shuffle(arr){ const a=[...arr]; for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; }
function show(id){ ["start","game","end"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); }

function startGame(){
  order = shuffle(QUESTIONS); i=0; score=0; streak=0;
  show("game"); render();
}

function render(){
  const q = order[i];
  const pic=$("pic");
  if(q.img){ pic.src=q.img; pic.alt=q.alt; pic.classList.remove("hidden"); }
  else { pic.removeAttribute("src"); pic.classList.add("hidden"); }
  $("count").textContent = `Question ${i+1} of ${order.length}`;
  $("question").textContent = q.q;
  $("fill").style.width = (i/order.length*100)+"%";
  $("score").textContent = "Score "+score;
  $("streak").textContent = "Streak "+streak;
  $("feedback").className = "feedback";
  $("nextBtn").classList.remove("show");
  const choices = shuffle([q.a, ...q.w]);
  const box = $("opts"); box.innerHTML = "";
  choices.forEach((c,n)=>{
    const b = document.createElement("button");
    b.className="opt";
    b.innerHTML = `<span class="k">${"ABCD"[n]}</span><span></span>`;
    b.lastChild.textContent = c;
    b.onclick = ()=>answer(b, c===q.a);
    b.dataset.right = c===q.a ? "1" : "";
    box.appendChild(b);
  });
}

const PRAISE = ["Great job!","Awesome!","You got it!","Perfect!","Nice one!"];
const OOPS = ["Almost!","Not quite!","Oops!"];

function answer(btn, ok){
  const all = [...document.querySelectorAll(".opt")];
  all.forEach(b=>{
    b.disabled = true;
    if(b.dataset.right) b.classList.add("right");
    else if(b!==btn) b.classList.add("dim");
  });
  if(ok){ score++; streak++; } else { btn.classList.add("wrong"); streak=0; }
  $("score").textContent = "Score "+score;
  $("streak").textContent = "Streak "+streak;
  const fb = $("feedback");
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  fb.className = "feedback show " + (ok?"ok":"no");
  fb.innerHTML = `<b>${ok ? pick(PRAISE) + (streak>=3 ? " "+streak+" in a row" : "") : pick(OOPS)}</b><span></span>`;
  fb.lastChild.textContent = order[i].x;
  const nb = $("nextBtn");
  nb.textContent = i===order.length-1 ? "See my score" : "Next question";
  nb.classList.add("show"); nb.focus();
}

function next(){
  i++;
  if(i<order.length){ render(); window.scrollTo({top:0}); }
  else finish();
}

function finish(){
  $("fill").style.width="100%";
  show("end");
  $("final").textContent = score;
  let title, text;
  if(score===5){ title="Perfect score!"; text="You know everything about personality traits. Amazing!"; }
  else if(score>=4){ title="Excellent!"; text="You really paid attention to the presentation."; }
  else if(score>=3){ title="Good job!"; text="You know a lot. Play again to beat your score!"; }
  else { title="Keep practicing!"; text="Listen to the presentation again and try one more time."; }
  $("endTitle").textContent=title; $("endText").textContent=text;
  const perfect = score===order.length;
  $("end").classList.toggle("perfect", perfect);
  $("medalWrap").classList.toggle("hidden", !perfect);
  if(perfect) confetti();
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"), x=c.getContext("2d");
  c.width=innerWidth; c.height=innerHeight;
  const colors=["#FFD24A","#2E9BD6","#2FB67E","#E0456A"];
  const ps=Array.from({length:220},()=>({
    x:Math.random()*c.width, y:-20-Math.random()*c.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8, vy:2+Math.random()*3,
    vx:-1+Math.random()*2, r:Math.random()*6, vr:-.1+Math.random()*.2,
    col:colors[Math.floor(Math.random()*colors.length)]
  }));
  let t=0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
    });
    if(++t<360) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}

$("startBtn").onclick = startGame;
$("againBtn").onclick = startGame;
$("nextBtn").onclick = next;
</script>
